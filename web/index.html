<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyglot — Voice language tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-name">Polyglot</h1>
        <p class="brand-tag">Speak your way to fluency</p>
      </div>
      <div class="pills">
        <div class="pill demo-pill" id="demoPill" hidden>demo</div>
        <div class="pill live-pill" id="livePill" hidden><span class="live-dot"></span>live</div>
      </div>
    </header>

    <section class="setup" aria-label="Session setup">
      <label class="field">
        <span class="field-label">Language</span>
        <div class="segmented" id="langSeg" role="tablist" aria-label="Choose a language"></div>
      </label>
      <label class="field">
        <span class="field-label">Model</span>
        <select id="modelSelect" class="select" aria-label="Choose a model"></select>
      </label>
    </section>

    <section class="stage" aria-live="off">
      <div class="orb" id="orb" data-state="idle" aria-hidden="true">
        <div class="orb-ring r1"></div>
        <div class="orb-ring r2"></div>
        <div class="orb-core"><span class="orb-hint" id="orbHint">English</span></div>
      </div>
      <p class="status" id="status">Choose a language and start a discussion.</p>
      <p class="topic" id="topicLine" hidden>
        <span class="topic-kicker">Topic</span>
        <span class="topic-text" id="topicText"></span>
      </p>
    </section>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <div class="micdock" id="micDock" hidden>
      <button class="mic-btn" id="micBtn" type="button" aria-label="Tap to speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
        <span class="mic-label" id="micLabel">Tap to speak</span>
      </button>
      <form class="typeform" id="typeForm" autocomplete="off">
        <input class="typeinput" id="typeInput" type="text" placeholder="…or type your message">
        <button class="sendbtn" type="submit" aria-label="Send">↑</button>
      </form>
    </div>

    <section class="controls">
      <button class="btn btn-primary" id="startBtn" type="button">Start discussion</button>
      <button class="btn btn-ghost" id="endBtn" type="button" disabled>End discussion</button>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
